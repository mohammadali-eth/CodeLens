<!-- Startup Auth Check Loading State -->
<div class="auth-loading-overlay" *ngIf="authService.isLoadingAuth()">
  <div class="loading-pulse-box">
    <div class="logo-spinner">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="#0891B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="loading-text">Verifying CodeLens Session...</span>
  </div>
</div>

<ng-container *ngIf="!authService.isLoadingAuth()">
  <!-- Layout 1: Public Marketing Website Layout -->
  <ng-container *ngIf="isPublicPage()">
    <cdl-public-header></cdl-public-header>
    <main class="public-main-content">
      <router-outlet></router-outlet>
    </main>
    <cdl-public-footer></cdl-public-footer>
  </ng-container>

  <!-- Layout 2: Standalone Auth Layout -->
  <ng-container *ngIf="isAuthPage()">
    <div class="auth-page-wrapper">
      <router-outlet></router-outlet>
    </div>
  </ng-container>

  <!-- Layout 3: Authenticated Enterprise Dashboard Layout -->
  <ng-container *ngIf="!isPublicPage() && !isAuthPage()">
    <div class="app-layout-shell">
      <cdl-sidebar></cdl-sidebar>

      <main class="app-main-content">
        <cdl-top-header></cdl-top-header>

        <div class="page-content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </ng-container>
</ng-container>
