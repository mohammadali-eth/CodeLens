<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' - CodeLens'">CodeLens</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <!-- Custom Design System Stylesheet -->
  <link rel="stylesheet" th:href="@{/css/design-system.css}">
  <!-- FontAwesome Icons (Via CDN for UI simplicity) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- Complete App Grid Shell -->
  <div id="app-shell">

    <!-- Global Sidebar Segment -->
    <aside id="sidebar-wrapper" th:fragment="sidebar">
      <div class="sidebar-logo">
        <i class="fa-solid fa-square-poll-vertical me-2"></i> CodeLens
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-nav-link active">
          <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="#" class="sidebar-nav-link">
          <i class="fa-solid fa-folder-open"></i> Repositories
        </a>
        <a href="#" class="sidebar-nav-link">
          <i class="fa-solid fa-microchip"></i> AI Reviews
        </a>
        <a href="#" class="sidebar-nav-link">
          <i class="fa-solid fa-file-invoice"></i> Reports
        </a>
        <a href="#" class="sidebar-nav-link">
          <i class="fa-solid fa-shield-halved"></i> Verification
        </a>
        <a href="#" class="sidebar-nav-link">
          <i class="fa-solid fa-user-gear"></i> Settings
        </a>
      </nav>
    </aside>

    <!-- Global Layout Content Container -->
    <div id="content-wrapper">

      <!-- Header Fragment -->
      <header id="header-navbar" th:fragment="header">
        <div class="d-flex align-items-center w-100 justify-content-between">
          <div class="d-flex align-items-center">
            <button class="btn btn-link p-0 me-3 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-wrapper">
              <i class="fa-solid fa-bars fs-4 text-dark"></i>
            </button>
            <span class="fs-5 fw-600 text-dark">Enterprise Workspace</span>
          </div>
          <!-- Profile Quick Access -->
          <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa-regular fa-circle-user fs-5"></i>
              <span class="d-none d-md-inline">Developer Admin</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#"><i class="fa-regular fa-user me-2"></i> My Profile</a></li>
              <li><a class="dropdown-item" href="#"><i class="fa-solid fa-gears me-2"></i> Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#"><i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out</a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Main Central Workspace -->
      <main id="main-content">
        <!-- Breadcrumb component -->
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Library</a></li>
            <li class="breadcrumb-item active" aria-current="page">Data</li>
          </ol>
        </nav>

        <!-- Replaced by child view templates -->
        <div th:fragment="content">
          <p>Base Layout Main Content Area placeholder.</p>
        </div>
      </main>

      <!-- Global Footer -->
      <footer id="footer" th:fragment="footer">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
          <span>&copy; 2026 CodeLens Platform. All rights reserved.</span>
          <div class="d-flex gap-3">
            <a href="#" class="text-decoration-none text-muted">Privacy Policy</a>
            <a href="#" class="text-decoration-none text-muted">Terms of Service</a>
          </div>
        </div>
      </footer>

    </div>
  </div>

  <!-- Bootstrap Bundle JS (via CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6Rz8ynS7ogEvDej/m4gW3g5c9s9phGg135hQIBl39G8hK35Hz" crossorigin="anonymous"></script>
</body>
</html>
