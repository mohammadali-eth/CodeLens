# ===================================================================
# CodeLens - Development Profile Configuration (dev)
# ===================================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:codelens_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: CodeLens-HikariPool-Dev
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    clean-disabled: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

logging:
  level:
    root: INFO
    com.codelens: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG
