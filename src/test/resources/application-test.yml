# ===================================================================
# CodeLens - Test Profile Configuration (test)
# In-Memory H2 Database Engine for Fast, Isolated Integration Testing
# ===================================================================

spring:
  datasource:
    url: jdbc:h2:mem:codelens_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.codelens: INFO
