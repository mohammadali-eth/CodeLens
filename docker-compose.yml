version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codelens-postgres
    environment:
      POSTGRES_DB: codelens_db
      POSTGRES_USER: codelens_user
      POSTGRES_PASSWORD: codelens_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens_user -d codelens_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelens-network

  redis:
    image: redis:7-alpine
    container_name: codelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelens-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: codelens-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - codelens-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: codelens-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - codelens-network

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  codelens-network:
    driver: bridge
